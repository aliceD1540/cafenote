<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ゲストノート</title>
    <script src="qrcode.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Helvetica", Arial, sans-serif;
        background-color: #ffffff;
        padding: 0;
        margin: 0;
        min-height: 100vh;
      }
      .container {
        width: 590px;
        height: 360px;
        margin: 20px auto;
        background: #fff;
        border: 1px solid #000;
        position: relative;
        padding: 0;
      }
      @media (max-width: 640px) {
        .container {
          width: calc(100% - 20px);
          height: auto;
          min-height: 360px;
          margin: 10px;
        }
      }
      .header {
        display: flex;
        align-items: center;
        padding: 10px 20px;
        gap: 10px;
        border-bottom: 1px solid #000;
      }
      @media (max-width: 640px) {
        .header {
          flex-direction: column;
          padding: 10px;
          gap: 8px;
        }
      }
      .input-wrapper {
        display: flex;
        gap: 10px;
        flex: 1;
      }
      @media (max-width: 640px) {
        .input-wrapper {
          width: 100%;
        }
      }
      #message {
        width: 140px;
        height: 20px;
        padding: 2px 5px;
        border: 1px solid #000;
        font-size: 12px;
        font-family: "Helvetica", Arial, sans-serif;
        resize: none;
      }
      @media (max-width: 640px) {
        #message {
          flex: 1;
          width: auto;
          font-size: 16px;
          height: 32px;
        }
      }
      #message:focus {
        outline: 1px solid #000;
      }
      #submitBtn {
        width: 50px;
        height: 20px;
        padding: 0;
        background-color: #fff;
        color: #000;
        border: 1px solid #000;
        cursor: pointer;
        font-size: 12px;
        font-family: "Helvetica", Arial, sans-serif;
      }
      @media (max-width: 640px) {
        #submitBtn {
          width: 70px;
          height: 32px;
          font-size: 14px;
        }
      }
      #submitBtn:hover {
        background-color: #f0f0f0;
      }
      #submitBtn:disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }
      .note-section {
        font-size: 12px;
        color: #000;
        line-height: 1.4;
        flex: 1;
      }
      .qr-wrapper {
        width: 60px;
        height: 60px;
        border: 1px solid #000;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        padding: 4px;
      }
      .qr-wrapper img,
      .qr-wrapper canvas {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .qr-text {
        font-size: 10px;
        text-align: center;
      }
      #comments {
        height: 260px;
        padding: 7px 2px;
        margin: 0 20px;
        border: 1px solid #000;
        overflow-y: auto;
        font-size: 12px;
        line-height: 1.5;
        background-color: #fff;
      }
      @media (max-width: 640px) {
        #comments {
          height: 400px;
          margin: 0 10px;
          font-size: 14px;
          padding: 10px 5px;
        }
      }
      .comment {
        margin-bottom: 5px;
        color: #000;
        background-color: #fff;
      }
      .comment-text {
        display: inline;
      }
      .comment-text.hidden-content {
        color: #999;
        cursor: pointer;
        text-decoration: underline;
        user-select: none;
      }
      .comment-text.hidden-content:hover {
        color: #666;
      }
      .comment-time {
        display: inline;
        color: #666;
      }
      .no-comments {
        text-align: center;
        color: #999;
        padding: 20px;
      }
      .loading {
        text-align: center;
        padding: 20px;
        color: #666;
      }
      .message-overlay {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: #fff;
        border: 2px solid #000;
        padding: 20px;
        min-width: 300px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        z-index: 1000;
        display: none;
        text-align: center;
      }
      .message-overlay.error {
        border-color: #c62828;
        color: #c62828;
      }
      .message-overlay.success {
        border-color: #2e7d32;
        color: #2e7d32;
      }
      .message-overlay.warning {
        border-color: #856404;
        color: #856404;
      }
      @media (max-width: 610px) {
        .container {
          width: 100%;
          margin: 0;
          height: auto;
          min-height: 100vh;
        }
        #comments {
          height: calc(100vh - 150px);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="input-wrapper">
          <input 
            type="text"
            id="message" 
            maxlength="100" 
            placeholder="コメント入力"
          />
          <button type="button" id="submitBtn">投稿</button>
        </div>
        <div class="note-section">
          投稿は1分に1回までです<br />
          100件を超えたコメントは古いものから削除されます<br />
          コメントは5分おきに更新されます
        </div>
        <div class="qr-wrapper">
          <div id="qrcode"></div>
        </div>
      </div>

      <div id="comments">
        <div class="loading">読み込み中...</div>
      </div>
    </div>

    <div class="message-overlay" id="messageOverlay"></div>

    <script>
      const API_URL = 'http://localhost:8787';
      
      function getRoomIdFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.get('room') || 'AAA';
      }

      const ROOM_ID = getRoomIdFromUrl();
      const currentUrl = window.location.href;
      
      new QRCode(document.getElementById('qrcode'), {
        text: currentUrl,
        width: 52,
        height: 52,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.L
      });

      const messageInput = document.getElementById('message');
      const submitBtn = document.getElementById('submitBtn');
      const messageOverlay = document.getElementById('messageOverlay');
      const commentsContainer = document.getElementById('comments');

      function formatDate(timestamp) {
        const date = new Date(timestamp);
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        return `${year}-${month}-${day} ${hours}:${minutes}`;
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function renderComments(comments) {
        if (!comments || comments.length === 0) {
          commentsContainer.innerHTML = '<div class="no-comments">まだコメントがありません</div>';
          return;
        }

        commentsContainer.innerHTML = comments.map((comment, index) => {
          const isHidden = comment.is_hidden === 1;
          const displayText = isHidden ? '*** (クリックで表示)' : escapeHtml(comment.message);
          const textClass = isHidden ? 'comment-text hidden-content' : 'comment-text';
          const dataAttrs = isHidden ? `data-original-message="${escapeHtml(comment.message)}" data-is-revealed="false"` : '';
          
          return `<div class="comment"><span class="${textClass}" ${dataAttrs}>${displayText}</span> - <span class="comment-time">(${formatDate(comment.created_at)})</span></div>`;
        }).join('');

        // Add click event listeners to hidden content
        document.querySelectorAll('.comment-text.hidden-content').forEach(element => {
          element.addEventListener('click', function() {
            const originalMessage = this.getAttribute('data-original-message');
            const isRevealed = this.getAttribute('data-is-revealed') === 'true';
            
            if (isRevealed) {
              // Hide it again
              this.textContent = '*** (クリックで表示)';
              this.setAttribute('data-is-revealed', 'false');
            } else {
              // Reveal the message
              this.textContent = originalMessage;
              this.setAttribute('data-is-revealed', 'true');
            }
          });
        });
      }

      async function loadComments() {
        try {
          const response = await fetch(`${API_URL}/${ROOM_ID}`);
          if (response.ok) {
            const comments = await response.json();
            renderComments(comments);
          } else {
            commentsContainer.innerHTML = '<div class="no-comments">コメントの読み込みに失敗しました</div>';
          }
        } catch (error) {
          console.error('Error loading comments:', error);
          commentsContainer.innerHTML = '<div class="no-comments">コメントの読み込みに失敗しました</div>';
        }
      }

      function showMessage(message, type) {
        messageOverlay.textContent = message;
        messageOverlay.className = `message-overlay ${type}`;
        messageOverlay.style.display = 'block';
        setTimeout(() => {
          messageOverlay.style.display = 'none';
        }, 3000);
      }

      submitBtn.addEventListener('click', async function() {
        const message = messageInput.value.trim();
        if (message.length === 0) {
          showMessage('メッセージを入力してください', 'error');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = '...';

        try {
          const response = await fetch(`${API_URL}/${ROOM_ID}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ message }),
          });

          const data = await response.json();

          if (response.ok) {
            if (data.warning) {
              showMessage(data.warning, 'warning');
            } else {
              showMessage('投稿しました', 'success');
            }
            messageInput.value = '';
            await loadComments();
          } else {
            showMessage(data.error || '投稿に失敗しました', 'error');
          }
        } catch (error) {
          console.error('Error posting comment:', error);
          showMessage('投稿に失敗しました', 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = '投稿';
        }
      });

      messageInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          submitBtn.click();
        }
      });

      loadComments();
      setInterval(loadComments, 300000);
    </script>
  </body>
</html>
