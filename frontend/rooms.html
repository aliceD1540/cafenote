<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>部屋一覧 - CafeNote</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container help-page">
      <div class="header help-header">
        <h1>部屋一覧</h1>
      </div>

      <div id="roomListContainer">
        <div class="loading">読み込み中...</div>
      </div>

      <a href="index.html" class="back-link">← 新規部屋を作成</a>

      <div class="copyright">
        <a href="https://project-grimoire.dev/" target="_blank" rel="noopener noreferrer">© Project Grimoire</a>
      </div>
    </div>

    <script>
      const API_URL = 'http://localhost:8787';
      
      async function loadRooms() {
        const container = document.getElementById('roomListContainer');
        
        try {
          const response = await fetch(`${API_URL}/rooms`);
          
          if (!response.ok) {
            container.innerHTML = '<p class="no-comments">部屋一覧の読み込みに失敗しました</p>';
            return;
          }
          
          const rooms = await response.json();
          
          if (!rooms || rooms.length === 0) {
            container.innerHTML = '<p class="no-comments">まだ部屋がありません</p>';
            return;
          }
          
          const roomListHTML = rooms.map(roomId => {
            const roomUrl = `index.html?room_id=${encodeURIComponent(roomId)}`;
            return `
              <div class="room-item">
                <a href="${roomUrl}" class="room-link">${escapeHtml(roomId)}</a>
              </div>
            `;
          }).join('');
          
          container.innerHTML = `<div class="room-list">${roomListHTML}</div>`;
          
        } catch (error) {
          console.error('Error loading rooms:', error);
          container.innerHTML = '<p class="no-comments">部屋一覧の読み込みに失敗しました</p>';
        }
      }
      
      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }
      
      loadRooms();
    </script>
  </body>
</html>
